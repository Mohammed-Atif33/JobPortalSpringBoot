
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Dashboard | Job Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Recruiter Dashboard</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Browse Jobs</a>
        <button id="logoutBtn" type="button">Logout</button>
    </nav>
</header>

<main class="dashboard-container">
    <section class="dashboard-heading">
        <h2>Manage Your Jobs</h2>
        <p>View and manage the jobs you have posted.</p>
    </section>

    <section class="dashboard-summary">
        <div class="dashboard-card">
            <h3>Total Jobs Posted</h3>
            <p id="totalJobs">0</p>
        </div>
    </section>

    <section class="dashboard-actions">
        <h2>Post a New Job</h2>

        <form id="createJobForm">
            <label for="title">Job Title</label>
            <input type="text" id="title" name="title"
                   placeholder="e.g. Java Backend Developer" required>

            <label for="description">Job Description</label>
            <textarea id="description" name="description"
                      placeholder="Describe the job responsibilities"
                      required></textarea>

            <label for="location">Location</label>
            <input type="text" id="location" name="location"
                   placeholder="e.g. Pune" required>

            <label for="salary">Salary</label>
            <input type="number" id="salary" name="salary"
                   min="0" step="0.01" placeholder="e.g. 500000" required>

            <label for="experience">Experience (years)</label>
            <input type="number" id="experience" name="experience"
                   min="0" step="1" placeholder="e.g. 2" required>

            <button type="submit">Create Job</button>
            <p id="formMessage" role="status"></p>
        </form>
    </section>

    <section class="my-jobs-section">
        <h2>My Posted Jobs</h2>
        <p id="jobsMessage" role="status">Loading your jobs...</p>
        <div id="myJobsList"></div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
