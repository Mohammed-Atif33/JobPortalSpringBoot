
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobPortal</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a class="logo" href="index.html">JobPortal</a>
        <div class="nav-links">
            <a href="index.html">Home |</a>
            <a href="jobs.html">Find Jobs |</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <main class="auth-section">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p>Log in to continue your job search.</p>

            <form id="login-form">
                <input
                    type="email"
                    id="login-email"
                    placeholder="Email address"
                    required
                >
                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >
                <button type="submit">Login</button>
                <p id="login-message" role="status" aria-live="polite"></p>
            </form>

            <p>Don't have an account?
                <a href="register.html">Create an account</a>
            </p>
        </div>
    </main>

    <footer>
        <p>© 2026 JobPortal. Built with Java and Spring Boot.</p>
    </footer>
</body>
</html>
