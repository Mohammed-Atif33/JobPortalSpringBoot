spring.application.name=CareerNest

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/springjobproject}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.frontend-url=${FRONTEND_URL:http://localhost:5500}
app.frontend-login-path=${FRONTEND_LOGIN_PATH:/frontend/login.html}